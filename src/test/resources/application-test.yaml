spring:
  datasource:
    url: jdbc:h2:mem:ecotech-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    issuer: ecotech-api
    expiration: 3600

aws:
  ses:
    from-email: no-reply@ecotech.test
    region: us-east-1

app:
  base-url: http://localhost:8080
  storage:
    upload-dir: uploads-test

cors:
  allowed-origins:
    - http://localhost:3000
