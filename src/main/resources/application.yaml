spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: ecotech-api

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
    issuer: ecotech-api

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}

  ses:
    from-email: ${AWS_SES_FROM_EMAIL}
    region: ${AWS_REGION}

app:
  base-url: ${APP_BASE_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match:
    - /posts/**
    - /users/*/follow
    - /users/*/followers
    - /users/*/following
  paths-to-exclude:
    - /auth/**

logging:
  level:
    root: info
    org.springframework.security: info
