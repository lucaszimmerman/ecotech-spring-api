spring:
  application:
    name: ecotech-api

  datasource:
    url: jdbc:postgresql://localhost:5433/ecotech
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
        
        
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600
    issuer: ecotech-api

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}

logging:
  level:
    org.hibernate.SQL: debug
